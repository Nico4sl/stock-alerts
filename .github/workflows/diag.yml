name: diag
on: push
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, 'results')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py > results.txt 2>&1 || true
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add results.txt && git commit -qm results && git push -q
