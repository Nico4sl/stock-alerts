name: Check prices

# How checks keep running: GitHub's cron is unreliable (it often fires hours late or not at
# all), so each run that falls in the trading window starts the next one itself about
# 5 minutes later ("chain"). Cron and the hourly brief-writer task only need to start the
# chain once; duplicates collapse because only one run can wait in the queue.
on:
  schedule:
    # any of these starting = chain starts; the script only checks 09:30–16:20 New York
    # time and skips NYSE holidays (handles summer time)
    - cron: "*/10 12-20 * * 1-5"
  push:
    branches: [main]
    paths: ["config.json", "briefs/**", "app/**", "engine/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification"
        type: boolean
        default: false
      auto:
        description: "Started by the chain (behave like a scheduled run)"
        type: boolean
        default: false

permissions:
  contents: write   # only used to publish today's movers to the `data` branch
  actions: write    # lets a run start the next one (chain)
  pages: write
  id-token: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Note start time
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Restore alert memory
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Check prices and send alerts
        id: run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.auto }}" != "true" ]; then ARGS="--force"; fi
          if [ "${{ inputs.test_notification }}" = "true" ]; then ARGS="$ARGS --test-notification"; fi
          python3 engine/check.py --app-url "$APP_URL" $ARGS

      - name: Save alert memory
        if: steps.run.outputs.ran == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state
          key: alert-state-${{ github.run_id }}

      - name: Publish movers for the brief writer (data branch)
        if: steps.run.outputs.ran == 'true'
        run: |
          mkdir -p /tmp/pub && cp _site/data/brief-queue.json /tmp/pub/queue.json && cp _site/data/movers.json /tmp/pub/movers.json
          git config user.name "pullback-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin data 2>/dev/null; then
            git show origin/data:queue.json > /tmp/pub/old.json 2>/dev/null || true
          fi
          if cmp -s /tmp/pub/queue.json /tmp/pub/old.json; then echo "queue unchanged"; exit 0; fi
          git worktree add -q --detach /tmp/datawt
          cd /tmp/datawt
          if git rev-parse -q --verify origin/data >/dev/null; then git checkout -q -B data origin/data; else git checkout -q --orphan data; git rm -rfq . ; fi
          cp /tmp/pub/queue.json /tmp/pub/movers.json .
          git add queue.json movers.json
          git commit -qm "Movers $(jq -r .date queue.json): $(jq -r '[.movers[].symbol]|join(", ")' queue.json)"
          git push -q origin data

      - uses: actions/configure-pages@v5
        if: steps.run.outputs.ran == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.ran == 'true'
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        if: steps.run.outputs.ran == 'true'

      # ---- start the next run ~5 min after this one started (only in the trading window)
      - name: Start next check
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 engine/check.py --chain-window; then echo "outside trading window – chain stops"; exit 0; fi
          wait=$(( ${T0:-$(date +%s)} + 290 - $(date +%s) ))
          if [ $wait -gt 0 ]; then echo "next check in ${wait}s"; sleep $wait; fi
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/check.yml/dispatches" \
            -f ref=main -f "inputs[auto]=true" -f "inputs[test_notification]=false"
          echo "next check started"
